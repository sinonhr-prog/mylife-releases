<body>
<header class="pagehead"><div><div class="kicker">Моя жизнь / Бумага</div><h1>Мой день, с первого взгляда</h1><p>Четыре варианта главной. Все категории — в меню слева.</p></div><span class="badge">Белый + графитовый</span></header>
<div class="controls" aria-label="Вариант расположения блоков"></div>
<main class="gallery" aria-label="Варианты главной страницы"></main>
<p class="pagefoot">Нажмите ☰ внутри телефона: меню выезжает слева. Выберите категорию, закройте меню крестиком, нажатием снаружи или Escape. Данные демонстрационные.</p>
<div class="toast" role="status" hidden></div>
<script>
(()=>{
 const layouts={blocks:['Блоки','Спокойный обзор'],tiles:['Плитки','Больше на одном экране'],focus:['Фокус','Ближайшее дело первым'],timeline:['Лента дня','В порядке времени']};
 const items=[['home','Главная','home'],['purchases','Покупки','bag'],['shops','Магазины','store'],['parks','Парки','tree'],['cafes','Кафе','coffee'],['restaurants','Рестораны','meal'],['tasks','Задачи','check'],['notes','Заметки','note'],['reminders','Напоминания','bell'],['vault','Пароли','lock'],['settings','Настройки','settings']];
 const routeLabel=route=>({recent:'Последние записи',recentplaces:'Недавние места'}[route]||items.find(i=>i[0]===route)?.[1]);
 const paths={menu:'M4 6h16M4 12h16M4 18h16',close:'m6 6 12 12M6 18 18 6',home:'m3 10 9-7 9 7v11h-6v-7H9v7H3Z',bag:'M4 7h16v14H4ZM8 7V5a4 4 0 0 1 8 0v2',store:'M3 9h18L18 3H6ZM5 9v12h14V9M9 21v-7h6v7',tree:'m12 2-7 9h4l-5 6h16l-5-6h4ZM12 17v5',coffee:'M4 5h12v8a6 6 0 0 1-12 0ZM16 6h3a3 3 0 0 1 0 6h-3M3 21h15',meal:'M4 3v7h6V3M7 3v18M19 3v18M19 3c-5 4-5 9 0 9',check:'M5 5h14v16H5ZM9 2h6v5H9M8 13l3 3 5-6',note:'M5 3h14v18H5ZM8 8h8M8 12h8M8 16h5',bell:'M4 17h16l-2-4V9a6 6 0 0 0-12 0v4ZM10 21h4',lock:'M6 10h12v11H6ZM8 10V7a4 4 0 0 1 8 0v3M12 15v2',settings:'M12 3v3M12 18v3M3 12h3M18 12h3M6 6l2 2M16 16l2 2M6 18l2-2M16 8l2-2M16 12a4 4 0 1 1-8 0 4 4 0 0 1 8 0',plus:'M12 5v14M5 12h14',search:'M20 20l-5-5M17 10a7 7 0 1 1-14 0 7 7 0 0 1 14 0',arrow:'m9 5 7 7-7 7'};
 const ico=n=>`<svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="${paths[n]}"/></svg>`;
 const header=(title,route)=>`<div class="sectionhead"><h3>${title}</h3><button data-route="${route}">Все</button></div>`;
 const line=(title,meta,time='',icon='')=>`<div class="line">${icon?ico(icon):'<span class="square" aria-hidden="true"></span>'}<div class="details"><b>${title}</b><small>${meta}</small></div>${time?`<time>${time}</time>`:''}</div>`;
 const tasks=()=>line('Забрать заказ','Пункт выдачи рядом','18:30')+line('Разобрать фотографии','Без срока');
 const reminds=()=>line('Полить растения','Сегодня','20:00','bell')+line('Сделать резервную копию','Воскресенье','20:00','bell');
 const place=(name,meta,icon)=>`<div class="placecard"><div class="placeart">${ico(icon)}</div><div><b>${name}</b><p>${meta}</p></div></div>`;
 const places=()=>place('Парк у реки','Вчера · прогулка','tree')+place('Кофейня на углу','14 октября','coffee');
 const record=(name,meta,icon)=>`<div class="record">${ico(icon)}<div><b>${name}</b><small>${meta}</small></div></div>`;
 const records=()=>record('Наушники','Покупка · сегодня, 11:20','bag')+record('Идеи на выходные','Заметка · вчера, 21:10','note');
 const intro=(title='Мой день',subtitle='Пятница. Всё важное рядом.')=>`<div class="intro"><div class="date">16 октября · пятница</div><h2>${title}</h2><p>${subtitle}</p></div>`;
 function dashboard(layout){
  if(layout==='blocks')return intro()+`<section class="panel">${header('Текущие дела','tasks')}${tasks()}</section><section class="panel">${header('Ближайшие напоминания','reminders')}${reminds()}</section><section class="section">${header('Недавно посетил','recentplaces')}${places()}</section><section class="section">${header('Последние записи','recent')}${records()}</section>`;
  if(layout==='tiles')return intro('Всё под рукой','Дела, напоминания и свежие записи.')+`<div class="tiles"><section class="tile wide">${header('Текущие дела','tasks')}${tasks()}</section><section class="tile"><div class="tiletitle"><h3>Напоминания</h3>${ico('bell')}</div>${line('Полить растения','Сегодня · 20:00')}${line('Резервная копия','Вс · 20:00')}<button class="tilebutton" data-route="reminders">Все напоминания</button></section><section class="tile"><div class="tiletitle"><h3>Недавно<br>посетил</h3>${ico('tree')}</div>${place('Парк у реки','Вчера','tree')}${place('Кофейня','14 октября','coffee')}<button class="tilebutton" data-route="recentplaces">Мои места</button></section><section class="tile wide">${header('Последние записи','recent')}${records()}</section></div>`;
  if(layout==='focus')return intro('Сначала главное','Остальное успеется.')+`<section class="focuscard"><div class="label"><span>Ближайшее дело</span>${ico('check')}</div><h3>Забрать заказ</h3><p>Пункт выдачи рядом с домом</p><div class="focusfoot"><span>Сегодня · 18:30</span><button data-route="tasks">Открыть</button></div></section><section class="section">${header('Ещё в планах','tasks')}${line('Разобрать фотографии','Без срока')}</section><section class="section">${header('Напоминания','reminders')}${reminds()}</section><section class="section">${header('Недавно посетил','recentplaces')}<div class="splitplaces">${places()}</div></section><section class="section">${header('Последние записи','recent')}${records()}</section>`;
  return intro('Лента дня','Что впереди и что хочется сохранить.')+`<div class="agenda"><section class="moment now"><div class="momenttime">Сегодня · дела</div><h3>Сделать в своём темпе</h3>${tasks()}</section><section class="moment"><div class="momenttime">Ближайшие напоминания</div>${reminds()}</section><section class="moment"><div class="momenttime">Последние записи</div>${records()}<button class="tilebutton" data-route="recent">Открыть записи</button></section><section class="moment"><div class="momenttime">Недавно посетил</div>${places()}<button class="tilebutton" data-route="recentplaces">Открыть места</button></section></div>`;
 }
 function routeContent(route){const title=routeLabel(route);let body='';if(route==='vault')return `<div class="lockview">${ico('lock')}<h2>Сейф закрыт</h2><p>Отпечаток или отдельный PIN.<br>Записи сейфа не попадают на главную.</p><button class="add" data-demo="Разблокировка появится в Android-приложении">Открыть сейф</button></div>`;
  if(route==='recent')body=records();else if(route==='recentplaces')body=places();else if(route==='tasks')body=tasks();else if(route==='reminders')body=reminds();else if(route==='notes')body=record('Идеи на выходные','Вчера · личное','note')+record('Что важно в рюкзаке','14 октября','note');else if(route==='purchases')body=record('Наушники','Оценка эксплуатации: 9 / 10','bag')+record('Термокружка','Оценка эксплуатации: 8 / 10','bag');else if(route==='parks')body=place('Парк у реки','Посетил вчера','tree');else if(route==='cafes')body=place('Кофейня на углу','Посетил 14 октября','coffee');else if(route==='shops')body=place('Книжный рядом','Любимый магазин','store');else if(route==='restaurants')body=place('Ресторан у набережной','Хочу посетить','meal');else body=record('Отдельный PIN и отпечаток','Управление доступом','lock')+record('Резервная копия','Вручную на компьютер / USB','bag');
  return `<h2 class="routeheading">${title}</h2><p class="routehint">Пример перехода из бокового меню.</p>${body}<button class="backhome" data-route="home">На главную</button>`;
 }
 const params=new URLSearchParams(location.search);let active=layouts[params.get('layout')]?params.get('layout'):'blocks';let compare=!params.has('layout');const routes={blocks:'home',tiles:'home',focus:'home',timeline:'home'};let openPhone=null,returnFocus=null;
 const gallery=document.querySelector('.gallery'),controls=document.querySelector('.controls');
 function sample(key){const route=routes[key],uid=`menu-${key}`;return `<figure class="sample" data-layout="${key}"><figcaption><span>${Object.keys(layouts).indexOf(key)+1}. ${layouts[key][0]}</span><small>${layouts[key][1]}</small></figcaption><div class="phone"><div class="statusbar">9:41<span>•••<i class="battery" aria-hidden="true"></i></span></div><div class="appbar"><button class="iconbtn menu-toggle" data-menu aria-label="Открыть меню" aria-expanded="false" aria-controls="${uid}">${ico('menu')}</button><strong>${route==='home'?'Моя жизнь':routeLabel(route)}</strong><button class="iconbtn last" data-demo="Поиск по личным записям. Сейф исключён." aria-label="Поиск">${ico('search')}</button></div><div class="content">${route==='home'?dashboard(key):routeContent(route)}</div><div class="footerbar"><button class="add" data-demo="Выбор типа новой записи">${ico('plus')}Добавить запись</button></div><div class="homeindicator"></div><button class="scrim" data-close aria-label="Закрыть меню" tabindex="-1" aria-hidden="true"></button><aside class="drawer" id="${uid}" role="dialog" aria-modal="true" aria-label="Категории приложения" aria-hidden="true" inert><div class="drawerhead"><h2>Моя жизнь</h2><button class="iconbtn" data-close aria-label="Закрыть меню">${ico('close')}</button></div><nav aria-label="Разделы приложения">${items.map(([id,label,icon],i)=>`${i===10?'<hr class="divider">':''}<button data-route="${id}" ${id===route?'aria-current="page"':''}>${ico(icon)}${label}</button>`).join('')}</nav><div class="drawerfoot">Ваше личное пространство.<br>Данные хранятся на телефоне.</div></aside></div></figure>`}
 function render(){closeMenu(false);controls.innerHTML=Object.entries(layouts).map(([id,[name]],i)=>`<button data-layout-choice="${id}" aria-pressed="${!compare&&active===id}">${i+1}. ${name}</button>`).join('')+`<button class="compare" data-compare aria-pressed="${compare}">Сравнить четыре</button>`;gallery.innerHTML=(compare?Object.keys(layouts):[active]).map(sample).join('');}
 function outsideInert(value){document.querySelectorAll('.pagehead,.controls,.pagefoot').forEach(el=>el.inert=value);document.querySelectorAll('.phone').forEach(p=>{if(p!==openPhone)p.inert=value;else p.querySelectorAll(':scope > .statusbar,:scope > .appbar,:scope > .content,:scope > .footerbar').forEach(el=>el.inert=value)})}
 function openMenu(phone,trigger){if(openPhone)closeMenu(false);openPhone=phone;returnFocus=trigger;const d=phone.querySelector('.drawer');d.inert=false;d.removeAttribute('aria-hidden');phone.classList.add('menu-open');trigger.setAttribute('aria-expanded','true');outsideInert(true);d.querySelector('button').focus();}
 function closeMenu(restore=true){if(!openPhone)return;outsideInert(false);openPhone.classList.remove('menu-open');const d=openPhone.querySelector('.drawer');d.inert=true;d.setAttribute('aria-hidden','true');openPhone.querySelector('[data-menu]').setAttribute('aria-expanded','false');openPhone=null;if(restore&&returnFocus?.isConnected)returnFocus.focus();returnFocus=null;}
 let toastTimer;document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const sampleEl=b.closest('.sample');if(b.hasAttribute('data-menu'))openMenu(b.closest('.phone'),b);else if(b.hasAttribute('data-close'))closeMenu();else if(b.dataset.layoutChoice){active=b.dataset.layoutChoice;compare=false;render()}else if(b.hasAttribute('data-compare')){compare=true;render()}else if(b.dataset.route&&sampleEl){const key=sampleEl.dataset.layout;routes[key]=b.dataset.route;closeMenu(false);const scrolls=Object.fromEntries([...document.querySelectorAll('.sample')].map(s=>[s.dataset.layout,s.querySelector('.content').scrollTop]));render();document.querySelectorAll('.sample').forEach(s=>s.querySelector('.content').scrollTop=s.dataset.layout===key?0:scrolls[s.dataset.layout]||0);document.querySelector(`[data-layout="${key}"] [data-menu]`).focus()}else if(b.dataset.demo){const toast=document.querySelector('.toast');toast.textContent='Макет: '+b.dataset.demo;toast.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.hidden=true,3000)}});
 document.addEventListener('keydown',e=>{if(!openPhone)return;if(e.key==='Escape'){e.preventDefault();closeMenu()}else if(e.key==='Tab'){const buttons=[...openPhone.querySelectorAll('.drawer button')];const first=buttons[0],last=buttons.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
 render();if(params.has('export'))document.body.classList.add('export');if(params.has('menu')){const phone=document.querySelector('.phone');openMenu(phone,phone.querySelector('[data-menu]'));}
 window.dashboardTest={set(layout){active=layout;compare=false;routes[layout]='home';render()},items:items.map(i=>i[0]),closeMenu};
})();
</script>
