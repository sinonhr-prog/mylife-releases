<style>

:7px;align-items:center}.statusbar svg{width:15px;height:15px}.topline{display:flex;align-items:center;justify-content:space-between;margin-bottom:15px}.brand{font-size:12px;letter-spacing:.5px;font-weight:600}.tiny{font-size:11px}.phone .icon{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}.content{padding:21px 22px 18px;flex:1;min-height:0;overflow-y:auto}.phone h2{font-size:35px;letter-spacing:-1.4px;line-height:1.12;font-weight:650;margin:0 0 9px}.subtitle{font-size:13px;margin:0 0 22px;line-height:1.5}.phone h3{font-size:18px;letter-spacing:-.3px;margin:24px 0 12px;font-weight:650}.sectionline{display:flex;justify-content:space-between;align-items:center}.sectionline small{font-size:12px;color:var(--ac)}.phone button{color:inherit}.iconbutton{border:0;background:transparent;min-width:44px;min-height:44px;display:inline-flex;align-items:center;justify-content:center}.searchbox{display:flex;align-items:center;gap:10px;border-bottom:1px solid color-mix(in srgb,var(--fg) 24%,var(--bg));padding:9px 0 14px;font-size:14px}.dateflag{color:var(--ac);font-size:11px;font-weight:650;text-transform:uppercase;letter-spacing:1px}.taskrow{display:flex;align-items:center;gap:13px;padding:14px 0;border-bottom:1px solid color-mix(in srgb,var(--fg) 13%,var(--bg));font-size:14px;line-height:1.4}.check{border:1.5px solid var(--fg);border-radius:6px;width:19px;height:19px;flex-shrink:0}.taskrow .meta{font-size:12px;margin-top:4px}.taskrow .time{font-size:12px;margin-left:auto;white-space:nowrap;color:var(--ac)}.categories{display:grid;grid-template-columns:1fr 1fr;gap:10px}.category{border:1px solid color-mix(in srgb,var(--fg) 20%,var(--bg));border-radius:15px;padding:16px 14px;background:transparent;text-align:left;min-height:100px}.category .icon{color:var(--ac);margin-bottom:12px}.category b{font-size:14px;display:block;font-weight:600}.category small{font-size:11px;display:block;margin-top:5px}.primary{border:0;border-radius:14px;padding:14px 18px;width:100%;font-size:14px;font-weight:600;min-height:48px;background:var(--ac);color:var(--bg)!important;margin-top:22px;display:flex;align-items:center;justify-content:center;gap:9px}.secondary{border:1px solid color-mix(in srgb,var(--fg) 30%,var(--bg));border-radius:14px;padding:13px 18px;width:100%;background:transparent;font-size:14px;min-height:48px;margin-top:10px}.bottom{display:flex;justify-content:space-around;border-top:1px solid color-mix(in srgb,var(--fg) 14%,var(--bg));padding:12px 8px 22px;background:var(--bg)}.bottom button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:6px;min-height:46px;min-width:58px;font-size:10px;padding:0}.bottom button.active{color:var(--ac);font-weight:700}.homebar{position:absolute;bottom:8px;height:3px;left:38%;width:24%;background:var(--fg);border-radius:3px}.chips{display:flex;gap:7px;flex-wrap:wrap;margin:18px 0}.chip{padding:7px 11px;border:1px solid color-mix(in srgb,var(--fg) 20%,var(--bg));border-radius:20px;font-size:11px}.chip.active{background:var(--fg);color:var(--bg)}.productrow{display:flex;gap:14px;padding:16px 0;border-bottom:1px solid color-mix(in srgb,var(--fg) 15%,var(--bg));align-items:center}.thumb{background:color-mix(in srgb,var(--ac) 9%,var(--bg));width:88px;height:94px;border-radius:14px;display:flex;align-items:center;justify-content:center;flex-shrink:0}.thumb svg{width:73px;height:73px}.productrow b{font-size:15px;font-weight:600}.productrow p{font-size:12px;margin:6px 0}.rating{color:var(--ac);font-size:13px;font-weight:700}.mutedline{font-size:11px;margin-top:5px}.photo{background:color-mix(in srgb,var(--ac) 9%,var(--bg));border-radius:20px;height:206px;display:flex;align-items:center;justify-content:center;margin:20px 0}.photo svg{height:185px;width:210px}.ratingline{display:flex;align-items:center;gap:12px;border-block:1px solid color-mix(in srgb,var(--fg) 15%,var(--bg));padding:15px 0;margin:18px 0}.ratingline strong{font-size:32px;color:var(--ac);letter-spacing:-1px}.ratingline span{font-size:12px}.description{font-size:14px;line-height:1.6}.fieldlabel{font-size:11px;letter-spacing:1px;text-transform:uppercase;margin:20px 0 7px}.linkfield{font-size:13px;color:var(--ac);word-break:break-all}.place{border-bottom:1px solid color-mix(in srgb,var(--fg) 15%,var(--bg));padding:20px 0;display:flex;gap:15px}.placeicon{background:color-mix(in srgb,var(--ac) 10%,var(--bg));height:48px;width:48px;border-radius:15px;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--ac)}.place b{font-size:15px;font-weight:600}.place p{font-size:12px;margin:7px 0}.place small{font-size:11px;color:var(--ac)}.note{padding:19px 0;border-bottom:1px solid color-mix(in srgb,var(--fg) 15%,var(--bg))}.note b{font-size:16px}.note p{font-size:13px;margin:8px 0;line-height:1.55}.note small{font-size:11px;color:var(--ac)}.vault{text-align:center;padding-top:34px}.vault .locksymbol{height:86px;width:86px;border:1px solid color-mix(in srgb,var(--fg) 20%,var(--bg));border-radius:28px;display:flex;align-items:center;justify-content:center;margin:18px auto 28px;color:var(--ac)}.locksymbol .icon{width:35px;height:35px}.vault h2{font-size:29px;letter-spacing:-.8px}.vault p{font-size:13px;line-height:1.65;max-width:245px;margin:14px auto 30px}.pin-dots{letter-spacing:12px;font-size:26px;margin:30px 0;color:var(--ac)}.vault .primary{margin-top:28px}.safe-caption{font-size:11px;line-height:1.5;margin-top:24px}.daytabs{display:flex;gap:8px;margin:20px 0}.day{flex:1;text-align:center;border:1px solid color-mix(in srgb,var(--fg) 20%,var(--bg));border-radius:12px;padding:10px 3px;font-size:11px}.day b{display:block;font-size:19px;margin-top:6px}.day.selected{background:var(--ac);color:var(--bg)}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);padding:14px 22px;border-radius:14px;background:#182536;color:#fff;font-size:13px;z-index:5;max-width:90%;text-align:center}.toast[hidden]{display:none}.footnote{font-size:12px;max-width:760px;text-align:center;margin:0 auto 30px;padding:0 20px;line-height:1.6}.overview .gallery{gap:16px;padding-top:28px}.overview .preview{width:308px}.overview .content{padding-inline:18px}.overview .phone{min-height:740px}.board header,.board .controls,.board .footnote{display:none}.board .gallery{padding:24px;gap:24px}.board .preview{width:360px}.overview h1{font-size:26px}.overview header{max-width:1660px}.overview .controls{max-width:1660px}.overview .screens{display:none}@media(max-width:600px){header,.controls{padding-inline:18px}header .tag{display:none}h1{font-size:26px}.gallery{padding-inline:12px}.compare{margin-left:0}.phone{min-height:748px}.themes button{font-size:13px}.caption small{font-size:10px}}@media(prefers-reduced-motion:no-preference){button{transition:background .15s ease}}
</style>

<body>
<header><div><div class="eyebrow">Личный каталог / Android</div><h1>Всё своё. В одном месте.</h1><p>Пять цветовых направлений для «Моей жизни»</p></div><span class="tag">Локальные макеты · 16 октября 2026</span></header>
<div class="controls"><div class="themes" aria-label="Цветовая схема"></div><div class="screens" aria-label="Экран приложения"></div></div>
<main class="gallery" aria-label="Варианты мобильного приложения"></main>
<p class="footnote">Демонстрационные данные. Переключайте темы и экраны; кнопки внутри показывают только сценарий. Не вводите личные данные.</p><div class="toast" role="status" hidden></div>
<script>
const themes={ink:{name:'Чернила',bg:'#F7F8FA',fg:'#182536',ac:'#244ED8'},forest:{name:'Хвоя',bg:'#F3F7F2',fg:'#17392F',ac:'#35694A'},plum:{name:'Слива',bg:'#FAF5FA',fg:'#35243B',ac:'#78468B'},night:{name:'Ночь',bg:'#161B25',fg:'#F0F3FA',ac:'#B0C5FF'},paper:{name:'Бумага',bg:'#FFFFFF',fg:'#202020',ac:'#202020'}};
const screens={home:'Главная',purchases:'Покупки',product:'Товар',places:'Места',tasks:'Дела',notes:'Заметки',vault:'Сейф'};
const paths={home:'M3 10 12 3l9 7v11h-6v-7H9v7H3Z',grid:'M3 3h7v7H3ZM14 3h7v7h-7ZM3 14h7v7H3ZM14 14h7v7h-7Z',check:'M5 5h14v16H5ZM9 2h6v5H9M8 13l3 3 5-6',lock:'M6 10h12v11H6ZM8 10V7a4 4 0 0 1 8 0v3M12 15v2',search:'M20 20l-5-5M17 10a7 7 0 1 1-14 0 7 7 0 0 1 14 0',plus:'M12 5v14M5 12h14',bag:'M4 7h16v14H4ZM8 7V5a4 4 0 0 1 8 0v2',tree:'m12 2-7 9h4l-5 6h16l-5-6h4ZM12 17v5',note:'M5 3h14v18H5ZM8 8h8M8 12h8M8 16h5',bell:'M4 17h16l-2-4V9a6 6 0 0 0-12 0v4ZM10 21h4',arrow:'M15 5l-7 7 7 7',settings:'M12 3v3M12 18v3M3 12h3M18 12h3M6 6l2 2M16 16l2 2M6 18l2-2M16 8l2-2M16 12a4 4 0 1 1-8 0 4 4 0 0 1 8 0',coffee:'M4 5h12v8a6 6 0 0 1-12 0ZM16 6h3a3 3 0 0 1 0 6h-3M3 21h15',store:'M3 9h18L18 3H6ZM5 9v12h14V9M9 21v-7h6v7',fingerprint:'M5 12a7 7 0 0 1 14 0M8 13a4 4 0 0 1 8 0v4M12 12v8M5 16v3M19 15v3M8 17v4',battery:'M2 7h17v10H2ZM22 10v4M5 10h9v4H5Z'};
function icon(name){return `<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="${paths[name]||paths.grid}"/></svg>`}
function art(kind='headphones'){if(kind==='bottle')return `<svg viewBox="0 0 200 200" aria-label="Иллюстрация термокружки" role="img"><rect x="70" y="35" width="62" height="130" rx="18" fill="var(--bg)" stroke="var(--fg)" stroke-width="3"/><path d="M70 65h62M83 35V25h36v10" fill="none" stroke="var(--fg)" stroke-width="5"/><path d="M91 82v55" stroke="var(--ac)" stroke-width="6" stroke-linecap="round"/></svg>`;return `<svg viewBox="0 0 240 200" aria-label="Иллюстрация наушников" role="img"><path d="M56 120V91c0-85 128-85 128 0v29" fill="none" stroke="var(--fg)" stroke-width="17" stroke-linecap="round"/><path d="M58 88c0-67 124-67 124 0" fill="none" stroke="var(--bg)" stroke-width="5"/><rect x="39" y="93" width="43" height="72" rx="20" fill="var(--ac)"/><rect x="158" y="93" width="43" height="72" rx="20" fill="var(--ac)"/><path d="M68 105v48M171 105v48" stroke="var(--bg)" stroke-width="3" opacity=".8"/></svg>`}
const primary=(text,ico='plus')=>`<button class="primary" data-demo="${text}">${icon(ico)}${text}</button>`;
const topbar=(label='МОЯ ЖИЗНЬ')=>`<div class="topline"><span class="brand">${label}</span><button class="iconbutton" aria-label="Настройки" data-demo="Настройки">${icon('settings')}</button></div>`;
const search=(label='Поиск по моим записям')=>`<div class="searchbox">${icon('search')}<span>${label}</span></div>`;
const task=(name,meta,time='')=>`<div class="taskrow"><span class="check" aria-hidden="true"></span><div>${name}<div class="meta">${meta}</div></div><span class="time">${time}</span></div>`;
const cat=(name,count,ico,screen)=>`<button class="category" data-screen="${screen}">${icon(ico)}<b>${name}</b><small>${count}</small></button>`;
function content(s){switch(s){
case 'home':return `${topbar()}<h2>Моё</h2><p class="subtitle">Всё важное — под рукой.</p>${search()}<div class="sectionline"><h3>Сегодня</h3><small>16 октября</small></div>${task('Забрать заказ','Пункт выдачи рядом','18:30')}<div class="sectionline"><h3>Мой каталог</h3><small>Все разделы</small></div><div class="categories">${cat('Покупки','24 вещи','bag','purchases')}${cat('Места','12 любимых мест','tree','places')}${cat('Заметки','8 записей','note','notes')}${cat('Напоминания','3 на этой неделе','bell','tasks')}</div>${primary('Добавить запись')}`;
case 'purchases':return `${topbar('КАТАЛОГ')}<h2>Мои покупки</h2><p class="subtitle">Вещи, которыми я пользуюсь.</p>${search('Найти вещь')}<div class="chips"><span class="chip active">Все · 24</span><span class="chip">Техника</span><span class="chip">Для дома</span></div><div class="productrow"><div class="thumb">${art()}</div><div><b>Наушники</b><p>Удобны каждый день</p><span class="rating">9 / 10</span><div class="mutedline">Моя оценка</div></div><button class="iconbutton" aria-label="Открыть товар" data-screen="product">›</button></div><div class="productrow"><div class="thumb">${art('bottle')}</div><div><b>Термокружка</b><p>Для прогулок в парке</p><span class="rating">8 / 10</span><div class="mutedline">Моя оценка</div></div></div><div class="note"><b>У каждой вещи — своя история</b><p>Фото, впечатления и ссылка на покупку в одной карточке.</p></div>${primary('Добавить покупку')}`;
case 'product':return `<div class="topline"><button class="iconbutton" aria-label="Назад к покупкам" data-screen="purchases">${icon('arrow')}</button><span class="brand">МОЯ ПОКУПКА</span><button class="iconbutton" data-demo="Избранное" aria-label="В избранное">☆</button></div><h2>Наушники</h2><p class="subtitle">Техника · куплены в сентябре</p><div class="photo">${art()}</div><div class="ratingline"><strong>9 <small style="font-size:16px">/ 10</small></strong><span>Моя оценка<br>после месяца использования</span></div><p class="description">Лёгкие и удобные. Использую дома и на прогулках. Заряда хватает на несколько дней.</p><div class="fieldlabel">Ссылка на покупку</div><div class="linkfield">shop.example / headphones</div>${primary('Редактировать','note')}`;
case 'places':return `${topbar('КАТАЛОГ')}<h2>Мои места</h2><p class="subtitle">Куда хочется возвращаться.</p>${search('Найти место')}<div class="chips"><span class="chip active">Все</span><span class="chip">Парки</span><span class="chip">Магазины</span><span class="chip">Кафе</span></div><div class="place"><div class="placeicon">${icon('tree')}</div><div><b>Парк у реки</b><p>Набережная, вход с южной стороны</p><small>Любимое · для вечерних прогулок</small></div></div><div class="place"><div class="placeicon">${icon('coffee')}</div><div><b>Кофейня на углу</b><p>Тихий зал, столик у окна</p><small>Хочу зайти в выходные</small></div></div><div class="place"><div class="placeicon">${icon('store')}</div><div><b>Книжный рядом</b><p>Хорошая полка с альбомами</p><small>Любимый магазин</small></div></div>${primary('Добавить место')}`;
case 'tasks':return `${topbar('МОЙ ДЕНЬ')}<h2>Без спешки</h2><p class="subtitle">Одно дело за другим.</p><div class="daytabs">${[['Чт','15'],['Пт','16'],['Сб','17'],['Вс','18'],['Пн','19']].map(([d,n])=>`<div class="day ${n==='16'?'selected':''}">${d}<b>${n}</b></div>`).join('')}</div><div class="sectionline"><h3>Сегодня</h3><small>2 задачи</small></div>${task('Забрать заказ','Напоминание включено','18:30')}${task('Прогуляться в парке','Для себя','19:00')}<h3>Напоминания</h3><div class="place"><div class="placeicon">${icon('bell')}</div><div><b>Сделать резервную копию</b><p>В воскресенье, 20:00</p><small>Раз в неделю</small></div></div><p class="description">На закрытом экране виден только общий сигнал.</p>${primary('Добавить задачу')}`;
case 'notes':return `${topbar('КАТАЛОГ')}<h2>Мои заметки</h2><p class="subtitle">Чтобы не держать всё в голове.</p>${search('Найти запись')}<div class="note"><small>ЛИЧНОЕ · СЕГОДНЯ</small><h3>Идеи на выходные</h3><p>Пройти новый маршрут вдоль реки, зайти в книжный и выбрать альбом.</p></div><div class="note"><small>ПОКУПКИ · ВЧЕРА</small><h3>Что важно в рюкзаке</h3><p>Лёгкий, без лишних карманов. Проверить, помещается ли термокружка.</p></div><div class="note"><small>ДОМ · 12 ОКТЯБРЯ</small><h3>Маленькие планы</h3><p>Разобрать полку и оставить любимые вещи.</p></div>${primary('Новая заметка')}`;
case 'vault':return `${topbar('ЛИЧНЫЙ СЕЙФ')}<div class="vault"><div class="locksymbol">${icon('lock')}</div><h2>Только для меня</h2><p>Откройте сейф отпечатком<br>или отдельным PIN приложения.</p><div class="pin-dots" aria-label="PIN скрыт">••••••••</div>${primary('Открыть отпечатком','fingerprint')}<button class="secondary" data-demo="Ввести PIN приложения">Ввести PIN приложения</button><div class="safe-caption">Сейф закрывается,<br>когда вы выходите из него.</div></div>`;
}}
const query=new URLSearchParams(location.search);let theme=themes[query.get('theme')]?query.get('theme'):'ink';let screen=screens[query.get('screen')]?query.get('screen'):'home';let compare=query.has('compare');const board=query.has('board');
function phone(t,s){const c=themes[t];return `<figure class="preview"><figcaption class="caption"><span>${Object.keys(themes).indexOf(t)+1}. ${c.name}</span><small>${screens[s]}</small></figcaption><section class="phone" style="--bg:${c.bg};--fg:${c.fg};--ac:${c.ac}" aria-label="${c.name}: ${screens[s]}"><div class="statusbar">9:41<span>••• ${icon('battery')}</span></div><div class="content">${content(s)}</div><nav class="bottom" aria-label="Навигация макета">${[['home','home','Главная'],['purchases','grid','Каталог'],['tasks','check','Дела'],['vault','lock','Сейф']].map(([id,i,n])=>`<button data-screen="${id}" class="${s===id||(id==='purchases'&&['product','places','notes'].includes(s))?'active':''}">${icon(i)}${n}</button>`).join('')}</nav><div class="homebar"></div></section></figure>`}
function render(){document.body.classList.toggle('overview',compare);document.body.classList.toggle('board',board);document.querySelector('.themes').innerHTML=Object.entries(themes).map(([id,t],i)=>`<button data-theme="${id}" aria-pressed="${theme===id&&!compare}"><span class="swatch" style="background:${t.ac}"></span>${i+1}. ${t.name}</button>`).join('')+`<button class="compare" data-compare aria-pressed="${compare}">Все пять рядом</button>`;document.querySelector('.screens').innerHTML=Object.entries(screens).map(([id,n])=>`<button data-screen="${id}" aria-pressed="${screen===id}">${n}</button>`).join('');document.querySelector('.gallery').innerHTML=board?['home','product','vault'].map(s=>phone(theme,s)).join(''):compare?Object.keys(themes).map(t=>phone(t,screen)).join(''):phone(theme,screen);}
let toastTimer;document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.theme){theme=b.dataset.theme;compare=false;render()}else if(b.hasAttribute('data-compare')){compare=!compare;render()}else if(b.dataset.screen){screen=b.dataset.screen;render()}else if(b.dataset.demo){const el=document.querySelector('.toast');el.textContent=`Макет: «${b.dataset.demo}». Данные не сохраняются.`;el.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.hidden=true,3000)}});render();
window.designTest={themes,screens,render,set(t,s){theme=t;screen=s;compare=false;render()}};
</script>
</body>
</html>
